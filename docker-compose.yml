services:
  ninimenu:
    build:
      context: .
      dockerfile: Dockerfile
    image: arre-cook/ninimenu:latest
    container_name: arre-cook-ninimenu
    restart: unless-stopped
    ports:
      - "127.0.0.1:9925:8080"
    networks:
      - default
      - blog-storage
    environment:
      TZ: Asia/Shanghai
      GIN_MODE: release
      APP_ENV: production
      PORT: "8080"
      DB_DRIVER: ${DB_DRIVER:-mysql}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ninimenu}
      MYSQL_USER: ${MYSQL_USER:-ninimenu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set the NiniMenu MySQL password}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-20}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-30m}
      UPLOAD_DIR: /app/uploads
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set the initial administrator email}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a strong initial administrator password}
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT signing secret}
      ALLOW_REGISTER: ${ALLOW_REGISTER:-true}
      EMAIL_DOMAINS: ${EMAIL_DOMAINS:-qq.com,foxmail.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://cook.arrebyte.top}
      PUBLIC_URL: ${PUBLIC_URL:-https://cook.arrebyte.top}
      SMTP_HOST: ${SMTP_HOST:-${MAIL_HOST:-smtp.qq.com}}
      SMTP_PORT: ${SMTP_PORT:-${MAIL_PORT:-587}}
      SMTP_USER: ${SMTP_USER:-${MAIL_USERNAME:-}}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-${MAIL_PASSWORD:-}}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-NiniMenu}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://garage:3900}
      S3_REGION: ${S3_REGION:-garage}
      S3_BUCKET: ${S3_BUCKET:-cook-uploads}
      S3_ACCESS_KEY: ${COOK_S3_ACCESS_KEY:?Create an app-specific Garage access key}
      S3_SECRET_KEY: ${COOK_S3_SECRET_KEY:?Set the Garage access key secret}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-/uploads/}
      S3_PREFIX: ${S3_PREFIX:-cook}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_CPA_CONFIG_PATH: ${LLM_CPA_CONFIG_PATH:-}
      LLM_CPA_BASE_URL: ${LLM_CPA_BASE_URL:-}
      LLM_CPA_MODEL: ${LLM_CPA_MODEL:-}
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      AGENT_RATE_LIMIT: ${AGENT_RATE_LIMIT:-120}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ninimenu-data:/app/data
      - ninimenu-uploads:/app/uploads
      - ${CPA_CONFIG_PATH:-/dev/null}:/run/cpa/provider-config:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ninimenu-data:
  ninimenu-uploads:

networks:
  blog-storage:
    external: true
    name: ${BLOG_DOCKER_NETWORK:-web-arrebyte_default}
