<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/chef-mark.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/180.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#C4E38B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="arre食谱推荐小助手" />
    <meta name="description" content="arre食谱推荐小助手 - 今天吃什么？让 arre食谱推荐小助手 帮你决定" />
    <title>arre食谱推荐小助手</title>
    <style>
      body { margin: 0; background: var(--color-bg, var(--boot-bg, #C4E38B)); }
      #root { min-height: 100dvh; }
    </style>
    <script>
      // Apply the saved appearance before React/CSS load, including a cold reload.
      (() => {
        const colors = { lime: ['#C4E38B', '#161D10'], peach: ['#F6D9C9', '#211916'], ocean: ['#C8E3ED', '#111F26'], berry: ['#EFD4DC', '#25181F'] };
        let preference;
        try { preference = JSON.parse(localStorage.getItem('ninimenu_appearance')); } catch { /* Storage may be unavailable. */ }
        const palette = Object.hasOwn(colors, preference?.palette) ? preference.palette : 'lime';
        const mode = ['light', 'dark', 'system'].includes(preference?.mode) ? preference.mode : 'system';
        const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        const root = document.documentElement;
        root.dataset.palette = palette;
        root.dataset.mode = dark ? 'dark' : 'light';
        root.style.setProperty('--boot-bg', colors[palette][dark ? 1 : 0]);
        document.querySelector('meta[name="theme-color"]').content = colors[palette][dark ? 1 : 0];
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
